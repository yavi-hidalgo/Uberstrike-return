<!doctype html><html><body style="margin:0"><canvas id="c" width="1200" height="1200"></canvas>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
const data = await (await fetch("/tmp-maps/factory.json")).json();
const r = new THREE.WebGLRenderer({ canvas: document.getElementById("c") });
r.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x223);
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
const L = new GLTFLoader(); L.setMeshoptDecoder(MeshoptDecoder);
const g = await L.loadAsync(`/tmp-maps/c08537c06a.glb`);
g.scene.scale.setScalar(data.scale); g.scene.position.y = data.groundOffset; scene.add(g.scene);
const mode = new URLSearchParams(location.search).get("mode") || "boxes";
if (mode === "boxes") {
  const geo = new THREE.BoxGeometry(1, 1, 1);
  for (const [a, b, c, d, e, f] of data.boxes) {
    const h = Math.min(1, e / 25);
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: new THREE.Color().setHSL(0.66 - h * 0.66, 1, 0.5), transparent: true, opacity: 0.35, depthWrite: false }));
    m.scale.set(d - a, e - b, f - c); m.position.set((a + d) / 2, (b + e) / 2, (c + f) / 2); scene.add(m);
  }
}
for (const [x, z] of data.spawns) { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 3), new THREE.MeshBasicMaterial({ color: 0x00ff66 })); m.position.set(x, 40, z); scene.add(m); }
for (const [x, z] of data.pickups) { const m = new THREE.Mesh(new THREE.BoxGeometry(1.4, 3, 1.4), new THREE.MeshBasicMaterial({ color: 0xff2020 })); m.position.set(x, 40, z); scene.add(m); }
const [[x0, z0], [x1, z1]] = data.bounds; const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2, half = Math.max(x1 - x0, z1 - z0) / 2 + 2;
const cam = new THREE.OrthographicCamera(-half, half, half, -half, 0.1, 500); cam.position.set(cx, 200, cz); cam.up.set(0, 0, -1); cam.lookAt(cx, 0, cz);
r.render(scene, cam); window.__done = true;
</script></body></html>
