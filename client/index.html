<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neonstrike</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" class="hidden">
      <div id="scope" class="hidden" aria-hidden="true"><div class="scope-ring"></div></div>
      <div id="crosshair" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div>
      <div id="hitmarker" aria-hidden="true"></div>
      <div id="damage-flash" aria-hidden="true"></div>
      <div id="killfeed"></div>
      <div id="toast" role="status"></div>

      <div id="scorebar">
        <div class="score-box me"><span class="score-label">TÚ</span><span id="score-me">0</span></div>
        <div class="score-mid">
          <span id="score-left">Faltan 20 bajas</span>
          <span id="ping">0 ms</span>
        </div>
        <div class="score-box lead"><span class="score-label" id="score-lead-name">—</span><span id="score-lead">0</span></div>
      </div>

      <div id="bottom-left">
        <div class="vital">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z" /></svg>
          <span id="hp-value">100</span>
        </div>
        <div id="hp-bar"><div id="hp-fill"></div></div>
      </div>
      <div id="bottom-right">
        <div class="ammo-line"><span id="ammo">30</span><span id="ammo-max">/ 30</span></div>
        <div class="weapon-name" id="weapon-name">KESTREL AR-7</div>
        <div class="slots"><span id="slot-1" class="active">1 PRINCIPAL</span><span id="slot-2">2 PISTOLA</span><span id="slot-3">3 CUERPO A CUERPO</span></div>
        <div id="reload" class="hidden">RECARGANDO</div>
      </div>

      <div id="death" class="hidden">
        <div id="death-title">Eliminado</div>
        <div id="death-sub"></div>
      </div>
      <div id="scoreboard" class="hidden">
        <h2 id="scoreboard-title">Marcador</h2>
        <table>
          <thead><tr><th>Jugador</th><th>Bajas</th><th>Muertes</th></tr></thead>
          <tbody id="scoreboard-body"></tbody>
        </table>
        <div id="scoreboard-hint">Mantén TAB para ver el marcador</div>
      </div>
      <div id="click-to-play" class="hidden">Haz clic para jugar</div>
    </div>

    <div id="menu"></div>

    <div id="pause" class="hidden" role="dialog" aria-label="Pausa">
      <div class="pause-card">
        <h2>Pausa</h2>
        <button type="button" id="pause-resume">Continuar</button>
        <label class="m-field"><span>Sensibilidad del ratón</span><div class="m-range"><input type="range" id="pause-sens" min="0.3" max="2.5" step="0.05" /><output id="pause-sens-out"></output></div></label>
        <label class="m-field"><span>Volumen de efectos</span><div class="m-range"><input type="range" id="pause-volume" min="0" max="1" step="0.05" /><output id="pause-volume-out"></output></div></label>
        <label class="m-field"><span>Volumen de música</span><div class="m-range"><input type="range" id="pause-music" min="0" max="1" step="0.05" /><output id="pause-music-out"></output></div></label>
        <button type="button" id="pause-exit" class="ghost">Salir al menú</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
