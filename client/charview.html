<!doctype html>
<html lang="es">
<head><meta charset="UTF-8" /><title>Vista de personajes</title></head>
<body style="margin:0;background:#111"><canvas id="out"></canvas>
<!-- Herramienta de desarrollo: dibuja personajes con su skin, equipo y arma, de frente y de lado.
     Uso: /charview.html?skins=a,b&helmet=id&vest=id&pack=id&weapon=id  (o &helmets=a,b,c para probar varios cascos en una skin) -->
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { buildCharacter, loadSkin } from "/src/skins.ts";
import { weaponObject } from "/src/weaponmodels.ts";
import { weaponModel } from "/@fs/home/user/uberstrike-return/shared/src/weapons.ts";
const q = new URLSearchParams(location.search);
const list = (k) => (q.get(k) || "").split(",").filter(Boolean);
const skins = list("skins");
// combinaciones: cada skin con el equipo fijo, o una skin con cada pieza de la lista
const combos = [];
const wl = list("weapons");
if (wl.length) for (const w of wl) combos.push({ skin: skins[0], helmet: "", vest: "", pack: "", label: w, weapon: w });
else for (const s of skins) {
  const multi = ["helmets", "vests", "packs"].find((k) => list(k).length);
  if (multi) for (const id of list(multi)) combos.push({ skin: s, helmet: multi === "helmets" ? id : q.get("helmet") || "", vest: multi === "vests" ? id : q.get("vest") || "", pack: multi === "packs" ? id : q.get("pack") || "", label: id });
  else combos.push({ skin: s, helmet: q.get("helmet") || "", vest: q.get("vest") || "", pack: q.get("pack") || "", label: s });
}
const W = 230, H = 330, cols = Math.min(combos.length, +(q.get("cols") || 8)) || 1;
const out = document.getElementById("out"); out.width = W * 2 * cols; out.height = H * Math.ceil(combos.length / cols);
const ctx = out.getContext("2d");
const c = document.createElement("canvas"); c.width = W; c.height = H;
const r = new THREE.WebGLRenderer({ canvas: c, antialias: true, preserveDrawingBuffer: true });
(await import("/src/ktx.ts")).initKTX2(r);
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping;
const env = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
const t = +(q.get("t") || 0), speed = +(q.get("speed") || 0);
for (let i = 0; i < combos.length; i++) {
  const k = combos[i];
  const s = new THREE.Scene(); s.background = new THREE.Color(0x3a4658); s.environment = env;
  s.add(new THREE.DirectionalLight(0xffffff, 2.2));
  await loadSkin(k.skin);
  const ch = buildCharacter(k.skin);
  if (ch) {
    await ch.setGear(k);
    if (k.weapon || q.get("weapon")) {
      const id = k.weapon || q.get("weapon");
      const w = await weaponObject(id);
      const cat = weaponModel(id)?.category;
      if (w) ch.holdWeapon(w, cat === "melee" ? "melee" : cat === "pistol" ? "pistol" : "rifle");
    }
    for (let j = 0; j < 20; j++) ch.update(t / 20, speed, false);
    s.add(ch.body);
  }
  const x = (i % cols) * W * 2, y = Math.floor(i / cols) * H;
  // el personaje mira hacia -Z: de frente = cámara en -Z; de lado = cámara en +X (su derecha)
  for (const [vi, pos] of (q.get("views") === "34" ? [[0, [1.7, 1.25, -2.7]], [1, [-2.2, 1.3, -2.2]]] : [[0, [0, 1.0, -3.2]], [1, [3.2, 1.0, 0]]])) {
    const zoom = +(q.get("zoom") || 1);
    const cam = new THREE.PerspectiveCamera(36 / zoom, W / H, 0.1, 50);
    cam.position.set(...pos); cam.lookAt(0, zoom > 1 ? 1.2 : 0.95, 0);
    // cámara a medida: cam=x,y,z;x,y,z (una por vista) y look=x,y,z
    // enfocar un hueso: focus=L_Wrist&off=x,y,z;x,y,z (desplazamiento de la cámara respecto al hueso)
    if (q.get("focus") && ch) {
      let bone = null; ch.body.traverse((o) => { if (!bone && o.isBone && o.name.startsWith(q.get("focus"))) bone = o; });
      if (bone) { s.updateMatrixWorld(true); const t = bone.getWorldPosition(new THREE.Vector3()); const off = (q.get("off") || "0.3,0.1,-0.5").split(";"); cam.position.copy(t).add(new THREE.Vector3(...(off[vi] ?? off[0]).split(",").map(Number))); cam.lookAt(t); }
    } else if (q.get("cam")) { const c = q.get("cam").split(";")[vi] ?? q.get("cam").split(";")[0]; cam.position.set(...c.split(",").map(Number)); cam.lookAt(...(q.get("look") || "0,1.2,0").split(",").map(Number)); }
    r.render(s, cam);
    ctx.drawImage(c, x + vi * W, y);
  }
  ctx.fillStyle = "#ffd"; ctx.font = "13px sans-serif"; ctx.fillText(k.label, x + 5, y + 14);
}
window.__done = true;
</script></body></html>
